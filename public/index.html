<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIT-ME-UP — Health Insights &amp; Tracking</title>
  <meta name="description" content="HIT-ME-UP — a personal health management platform that hits you up with the reminders that matter: vitals, medications, appointments, HIT workouts and nutrition." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Cpath d='M6 16.5 12.5 23 26 9.5' stroke='%23041a17' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
            <path d="M6 16.5 12.5 23 26 9.5" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">HIT-ME-UP</span>
          <span class="brand-sub">Health · Insights · Tracking</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="pulse-dot" id="liveDot"></div>
        <span id="liveLabel">Synced with server</span>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="topbar-title">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageDate"></p>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="bellBtn" aria-label="Reminders" title="Hit Me Up — reminders">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="badge-dot" id="bellDot" hidden></span>
          </button>
          <div class="user-chip" id="userChip">
            <div class="avatar" id="avatar">AC</div>
            <div class="user-meta">
              <strong id="userName">—</strong>
              <span id="userSub">Health member</span>
            </div>
          </div>
        </div>
      </header>

      <main id="view" class="view" aria-live="polite">
        <div class="boot-splash">
          <div class="spinner"></div>
          <p>Warming up your health hub…</p>
        </div>
      </main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <div id="modalRoot"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" onerror="window.__chartsBroken=true"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/vitals.js"></script>
  <script src="/js/views/medications.js"></script>
  <script src="/js/views/appointments.js"></script>
  <script src="/js/views/workouts.js"></script>
  <script src="/js/views/nutrition.js"></script>
  <script src="/js/views/reminders.js"></script>
  <script src="/js/views/profile.js"></script>
  <script src="/js/reminders-engine.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
